# https://developers.home-assistant.io/docs/apps/configuration
name: "hactl companion"
version: "2026.7.0"
slug: hactl_companion
description: "Bridge for the hactl CLI — config file access, Supervisor API, and HA CLI commands"
url: "https://github.com/hemm-ems/hactl-companion/blob/main/hactl_companion/DOCS.md"
arch:
  - amd64
  - aarch64
startup: application
ingress: true
ingress_port: 9100
ingress_entry: /
hassio_api: true
hassio_role: manager
homeassistant_api: true
privileged:
  - NET_ADMIN
map:
  - type: homeassistant_config
    read_only: false
options:
  vpn:
    enabled: false
    tunnel: wg0
    config: ""
schema:
  vpn:
    enabled: bool
    tunnel: "match(^[a-zA-Z0-9_]{1,15}$)"
    config: str?
image: "ghcr.io/hemm-ems/hactl-companion"
