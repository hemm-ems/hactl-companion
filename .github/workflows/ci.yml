name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest tests/ --ignore=tests/integration -v --tb=short

  openapi:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Validate spec matches code
        run: |
          uv run python -c "from companion.openapi import write_spec; write_spec('/tmp/generated.yaml')"
          diff -u openapi/companion-v1.yaml /tmp/generated.yaml

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: docker build -t hactl-companion:test .

  test-integration:
    name: Integration Tests (HA ${{ matrix.ha-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ha-version: [stable, prev]
        include:
          - ha-version: stable
            image: ghcr.io/home-assistant/home-assistant:stable
          - ha-version: prev
            image: ""  # computed below
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra integration
      - name: Compute previous HA version
        if: matrix.ha-version == 'prev'
        id: prev
        run: |
          prev_month=$(date -d "$(date +%Y-%m-01) -1 month" +%Y.%-m)
          echo "image=ghcr.io/home-assistant/home-assistant:${prev_month}" >> "$GITHUB_OUTPUT"
      - name: Override HA image in compose file
        run: |
          img="${{ matrix.image }}"
          if [ -z "$img" ]; then img="${{ steps.prev.outputs.image }}"; fi
          sed -i "s|ghcr.io/home-assistant/home-assistant:stable|${img}|g" docker-compose.integration.yaml
        env:
          HA_IMAGE: ${{ matrix.image }}
      - name: Run integration tests
        run: make test-int

  test-wireguard:
    name: WireGuard Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra integration
      - name: Run WireGuard integration tests
        run: make test-wg

  # ---------------------------------------------------------------------------
  # gates — the single required check.
  #
  # This aggregator exists so branch protection can require ONE check that
  # cannot be satisfied while any tier is skipped, cancelled or silently
  # absent: a skipped `needs` job leaves result != 'success' and fails here.
  # The companion mutates user config (backup-before-mutate, validate-or-
  # rollback), so its live-HA integration matrix and WireGuard tier are not
  # optional at the merge gate — unit tests alone are never acceptance.
  # ---------------------------------------------------------------------------
  gates:
    name: All Gates Green
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - test
      - openapi
      - docker
      - test-integration
      - test-wireguard
    steps:
      - name: Verify every gate succeeded
        run: |
          declare -A results=(
            [lint]="${{ needs.lint.result }}"
            [test]="${{ needs.test.result }}"
            [openapi]="${{ needs.openapi.result }}"
            [docker]="${{ needs.docker.result }}"
            [test-integration]="${{ needs.test-integration.result }}"
            [test-wireguard]="${{ needs.test-wireguard.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            printf '  %-20s %s\n' "$job" "${results[$job]}"
            if [ "${results[$job]}" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo
            echo "ERROR: a required gate did not succeed."
            echo "The live-HA integration matrix and the WireGuard tier are"
            echo "mandatory — the companion mutates user config, so a green run"
            echo "without them proves nothing about how it behaves against a"
            echo "real Home Assistant."
            exit 1
          fi
          echo
          echo "All gates green, every tier included."
