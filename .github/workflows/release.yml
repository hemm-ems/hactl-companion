name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch: {} # triggered by monthly-release workflow

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest tests/ --ignore=tests/integration -v --tb=short

  publish:
    name: Build & Push to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          echo "=== listing org container packages ==="
          gh api "/orgs/hemm-ems/packages?package_type=container" --jq '.[].name' || true
          echo "=== listing user container packages ==="
          gh api "/user/packages?package_type=container" --jq '.[].name' || true
          echo "=== patching ==="
          gh api --method PATCH \
            /orgs/hemm-ems/packages/container/hactl-companion \
            --field visibility=public

  annotate:
    name: Annotate release with image tags
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Append Docker image info to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "No release found for $TAG — skipping annotation"
            exit 0
          fi
          VERSION="${TAG#v}"
          MINOR="${VERSION%.*}"
          cat >> /tmp/extra.md <<EOF

          ---

          ### 🐳 Docker image

          \`\`\`bash
          docker pull ghcr.io/${REPO}:${VERSION}
          # or
          docker pull ghcr.io/${REPO}:${MINOR}
          \`\`\`
          EOF
          gh release view "$TAG" --repo "$REPO" --json body -q .body > /tmp/body.md
          cat /tmp/extra.md >> /tmp/body.md
          gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/body.md
