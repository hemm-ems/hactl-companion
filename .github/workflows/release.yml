name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        # Tag the image explicitly instead of deriving it from the git ref.
        #
        # The release workflows publish the image from the version-bump BRANCH,
        # before that bump reaches main — because main is what Home Assistant's
        # add-on store reads, and the moment it says 2026.7.11 every instance is
        # offered an update whose image must already exist. A branch ref carries
        # no semver for `docker/metadata-action` to read, so the version comes in
        # here instead.
        #
        # Left empty (a tag push, or a manual run against a tag) the behaviour is
        # unchanged and the tags are derived from the ref as before.
        description: "Version to tag the image with, e.g. 2026.7.11. Empty = derive from the git ref."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest tests/ --ignore=tests/integration -v --tb=short

  publish:
    name: Build & Push to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The `major.minor` moving tag the semver patterns produce from a git ref,
      # computed here for the explicit-version path so both paths publish the
      # same set of tags. An add-on pinned to `2026.7` must not stop moving just
      # because the image was built before its tag existed.
      - name: Derive major.minor from the version input
        id: majorminor
        if: inputs.version != ''
        run: echo "value=$(echo '${{ inputs.version }}' | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      # `latest` follows the release, because a release is the only thing this
      # workflow builds. It used to be gated on `is_default_branch`, which no
      # trigger here can satisfy — this runs on tags, on published releases, and
      # on dispatches against a version-bump branch, never on a push to main. So
      # `latest` simply stopped moving: it still pointed at 2026.7.10 while
      # 2026.7.11 was current. Nothing consumes it (the add-on pins
      # ghcr.io/…:{version}), but a tag that calls itself latest and is not is
      # worse than one that is absent.
      #
      # Caveat worth knowing: a manual re-run against an OLDER version moves
      # `latest` backwards. Re-run the newest release afterwards to restore it.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ steps.majorminor.outputs.value }},enable=${{ inputs.version != '' }}
            type=sha
            type=raw,value=latest,enable=${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          gh api --method PATCH \
            /orgs/hemm-ems/packages/container/hactl-companion \
            --field visibility=public

  annotate:
    name: Annotate release with image tags
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Append Docker image info to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "No release found for $TAG — skipping annotation"
            exit 0
          fi
          VERSION="${TAG#v}"
          MINOR="${VERSION%.*}"
          cat >> /tmp/extra.md <<EOF

          ---

          ### 🐳 Docker image

          \`\`\`bash
          docker pull ghcr.io/${REPO}:${VERSION}
          # or
          docker pull ghcr.io/${REPO}:${MINOR}
          \`\`\`
          EOF
          gh release view "$TAG" --repo "$REPO" --json body -q .body > /tmp/body.md
          cat /tmp/extra.md >> /tmp/body.md
          gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/body.md
