name: Patch Release

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for patch release (optional, shown in release notes)"
        required: false
        default: ""

concurrency:
  group: patch-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  # The version bump lands on protected main through a pull request.
  pull-requests: write

jobs:
  # ---------- Job 0: compute next patch version ----------
  versions:
    name: Compute Patch Version
    runs-on: ubuntu-latest
    outputs:
      next-tag: ${{ steps.calc.outputs.next_tag }}
      next-version: ${{ steps.calc.outputs.next_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate next patch version
        id: calc
        run: |
          # Find latest CalVer tag (vYYYY.M.PATCH)
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]{4}\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest" ]; then
            echo "::error::No CalVer tag found (vYYYY.M.PATCH). Run monthly-release first to establish the baseline."
            exit 1
          fi
          echo "Latest tag: ${latest}"

          # Parse and increment patch
          ver=$(echo "$latest" | sed 's/^v//')
          yyyy=$(echo "$ver" | cut -d. -f1)
          m=$(echo "$ver" | cut -d. -f2)
          patch=$(echo "$ver" | cut -d. -f3)
          next_patch=$((patch + 1))
          next_tag="v${yyyy}.${m}.${next_patch}"

          echo "next_tag=${next_tag}" >> "$GITHUB_OUTPUT"
          echo "next_version=${yyyy}.${m}.${next_patch}" >> "$GITHUB_OUTPUT"

      - name: Check tag does not exist
        run: |
          tag="${{ steps.calc.outputs.next_tag }}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists — already released or duplicate run"
            exit 1
          fi
          echo "Next patch tag: ${tag}"

  # ---------- Job 1: run tests ----------
  test:
    name: Test
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest tests/ --ignore=tests/integration -v --tb=short

  # ---------- Job 2: create release + trigger Docker build ----------
  release:
    name: Release ${{ needs.versions.outputs.next-tag }}
    needs: [versions, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PACKAGES_TOKEN }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev

      # Bump the version FIRST and land it on main, so the tag cut next points at
      # the bumped commit. Otherwise the image (built from the tag) is built from
      # pre-bump code and self-reports the previous version.
      #
      # The bump goes through a pull request, not `git push origin HEAD:main`.
      # main requires three status checks and has enforce_admins on, so a commit
      # created seconds ago cannot be pushed to it by anyone: it has no check
      # results, and there is no identity left that may skip them. The direct
      # push failed exactly that way on the first release after the protection
      # went on (2026-07-31, v2026.7.9):
      #
      #     remote: error: GH006: Protected branch update failed for refs/heads/main.
      #     remote: - 3 of 3 required status checks are expected.
      #
      # Auto-merge lets the required checks run and then squashes the bump in.
      # This step does not return until the bump is actually on main, because
      # "Create GitHub Release" below cuts its tag from --target main and would
      # otherwise tag the pre-bump commit — the very failure the ordering above
      # exists to prevent.
      - name: Bump version on main
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          VER="${{ needs.versions.outputs.next-version }}"
          tag="${{ needs.versions.outputs.next-tag }}"
          # Idempotent: if a previous run already bumped (e.g. it then failed at
          # release creation on a transient API error), skip so re-running this
          # workflow resumes cleanly instead of committing a duplicate bump.
          if grep -qx "version: \"${VER}\"" hactl_companion/config.yaml; then
            echo "::notice::config.yaml already at ${VER}; skipping bump (resuming a partial release)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s/^version = .*/version = \"${VER}\"/" pyproject.toml
          sed -i "s/^version: .*/version: \"${VER}\"/" hactl_companion/config.yaml
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" src/companion/__init__.py
          # Regenerate the OpenAPI spec from the bumped __version__ so info.version and the
          # ENDPOINT_META-derived body stay in one source of truth (no drift vs `make spec`).
          uv run python -c "from companion.openapi import write_spec; write_spec()"
          # Generate notes via the API (no release exists yet — created below).
          NOTES=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${tag}" -f target_commitish=main --jq '.body' | sed '/^---$/,$d')
          {
            printf "## %s\n\n%s\n\n" "${VER}" "${NOTES}"
            cat hactl_companion/CHANGELOG.md
          } > /tmp/changelog_new.md
          mv /tmp/changelog_new.md hactl_companion/CHANGELOG.md
          git add pyproject.toml openapi/companion-v1.yaml hactl_companion/config.yaml src/companion/__init__.py hactl_companion/CHANGELOG.md
          git commit -m "release: bump version to ${VER}"

          # Force-push and tolerate an existing PR: a run that died while the
          # bump PR was open must be able to resume onto the same branch.
          branch="release/bump-${VER}"
          git push --force origin "HEAD:refs/heads/${branch}"
          gh pr create --base main --head "${branch}" \
            --title "release: bump version to ${VER}" \
            --body "Version bump for ${tag}, opened by the patch-release workflow. Auto-merges once the required checks pass; the release job is blocked until it lands." \
            || echo "::notice::a PR for ${branch} already exists; reusing it"
          # --auto is refused when the PR is already mergeable (nothing left to
          # wait for), so fall back to merging it outright.
          gh pr merge "${branch}" --squash --auto --delete-branch \
            || gh pr merge "${branch}" --squash --delete-branch

          # Wait for the squash to appear on main. Poll the file rather than the
          # PR state: what the next step needs is the bumped content reachable
          # from main, and that is what this asserts.
          for _ in $(seq 1 60); do
            sleep 20
            git fetch --quiet origin main
            if git show "origin/main:hactl_companion/config.yaml" | grep -qx "version: \"${VER}\""; then
              echo "::notice::bump for ${VER} landed on main"
              exit 0
            fi
          done
          echo "::error::bump PR for ${VER} did not land on main within 20 minutes — check its required checks, then re-run this workflow (the bump step is idempotent)"
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --target main now resolves to the bump commit pushed above, so the
          # tag (and the image built from it) carry the correct version.
          tag="${{ needs.versions.outputs.next-tag }}"
          gh release create "${tag}" \
            --title "${tag}" \
            --generate-notes \
            --target main \
            --latest

      - name: Trigger Docker build and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.versions.outputs.next-tag }}"
          gh workflow run release.yml --ref "${tag}"
          echo "::notice::Docker build triggered for ${tag} via release.yml"
