name: Patch Release

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for patch release (optional, shown in release notes)"
        required: false
        default: ""

concurrency:
  group: patch-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  # The version bump lands on protected main through a pull request.
  pull-requests: write

jobs:
  # ---------- Job 0: compute next patch version ----------
  versions:
    name: Compute Patch Version
    runs-on: ubuntu-latest
    outputs:
      next-tag: ${{ steps.calc.outputs.next_tag }}
      next-version: ${{ steps.calc.outputs.next_version }}
      ha-stable: ${{ steps.ha.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve HA versions
        id: ha
        uses: ./.github/actions/ha-versions

      - name: Calculate next patch version
        id: calc
        env:
          HA_SERIES: ${{ steps.ha.outputs.stable_month }}
        run: |
          # One rule, shared with monthly-release and with hactl:
          # .github/scripts/next-version.sh. It reads every tag, extends the
          # newest, rolls only when HA is ahead of it, and refuses outright to
          # return anything that does not outrank what already exists.
          next_tag=$(git tag | ./.github/scripts/next-version.sh "${HA_SERIES}")
          echo "next_tag=${next_tag}" >> "$GITHUB_OUTPUT"
          echo "next_version=${next_tag#v}" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${next_tag} (HA stable ${{ steps.ha.outputs.stable }})"

      - name: Check tag does not exist
        run: |
          tag="${{ steps.calc.outputs.next_tag }}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists — already released or duplicate run"
            exit 1
          fi
          echo "Next patch tag: ${tag}"

  # ---------- Job 1: run tests ----------
  test:
    name: Test
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest tests/ --ignore=tests/integration -v --tb=short

  # ---------- Job 2: create release + trigger Docker build ----------
  release:
    name: Release ${{ needs.versions.outputs.next-tag }}
    needs: [versions, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PACKAGES_TOKEN }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev

      # The release is four ordered facts, and the order is the whole point:
      #
      #   1. the bump exists on a BRANCH        (nothing reads it yet)
      #   2. the image for that version is PUBLISHED and verified
      #   3. the bump lands on MAIN             (the add-on store now sees it)
      #   4. the tag and GitHub Release are cut from main
      #
      # Step 3 is the advertisement: Home Assistant's add-on store reads
      # `version` from hactl_companion/config.yaml on the default branch, and the
      # Supervisor pulls <image>:<that version>. Doing it before step 2 is what
      # made "Update" fail on every release — see the step that publishes below.
      #
      # The bump still reaches main through a pull request rather than
      # `git push origin HEAD:main`. main requires three status checks and has
      # enforce_admins on, so a commit created seconds ago cannot be pushed to it
      # by anyone: it has no check results, and there is no identity left that
      # may skip them. The direct push failed exactly that way on the first
      # release after the protection went on (2026-07-31, v2026.7.9):
      #
      #     remote: error: GH006: Protected branch update failed for refs/heads/main.
      #     remote: - 3 of 3 required status checks are expected.
      #
      # The bump commit is also what the image is built from, so the tag cut from
      # main in step 4 carries the same version the image self-reports.
      - name: Prepare the version bump on a branch
        id: bump
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          VER="${{ needs.versions.outputs.next-version }}"
          tag="${{ needs.versions.outputs.next-tag }}"
          # Idempotent: if a previous run already bumped (e.g. it then failed at
          # release creation on a transient API error), skip so re-running this
          # workflow resumes cleanly instead of committing a duplicate bump.
          if grep -qx "version: \"${VER}\"" hactl_companion/config.yaml; then
            echo "::notice::config.yaml already at ${VER}; skipping bump (resuming a partial release)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s/^version = .*/version = \"${VER}\"/" pyproject.toml
          sed -i "s/^version: .*/version: \"${VER}\"/" hactl_companion/config.yaml
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" src/companion/__init__.py
          # Regenerate the OpenAPI spec from the bumped __version__ so info.version and the
          # ENDPOINT_META-derived body stay in one source of truth (no drift vs `make spec`).
          uv run python -c "from companion.openapi import write_spec; write_spec()"
          # Generate notes via the API (no release exists yet — created below).
          NOTES=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${tag}" -f target_commitish=main --jq '.body' | sed '/^---$/,$d')
          {
            printf "## %s\n\n%s\n\n" "${VER}" "${NOTES}"
            cat hactl_companion/CHANGELOG.md
          } > /tmp/changelog_new.md
          mv /tmp/changelog_new.md hactl_companion/CHANGELOG.md
          git add pyproject.toml openapi/companion-v1.yaml hactl_companion/config.yaml src/companion/__init__.py hactl_companion/CHANGELOG.md
          git commit -m "release: bump version to ${VER}"

          # Force-push and tolerate an existing PR: a run that died while the
          # bump PR was open must be able to resume onto the same branch.
          branch="release/bump-${VER}"
          git push --force origin "HEAD:refs/heads/${branch}"
          echo "bump-branch=${branch}" >> "$GITHUB_OUTPUT"

      # ---- the image must exist before the bump can reach main ----
      #
      # Home Assistant's add-on store reads `version` from
      # hactl_companion/config.yaml on the DEFAULT BRANCH, and the Supervisor
      # then pulls <image>:<that version>. So merging the bump is the act of
      # advertising the release, and until this point it has not happened: the
      # bump is sitting on a branch nothing reads.
      #
      # This ordering is the fix for a failure that recurred every release and
      # was twice written off as bad luck. The workflow used to bump main, cut
      # the tag, and only then trigger the Docker build — which runs its own
      # test job before a two-platform buildx. That left a window, minutes wide,
      # in which every instance was offered an update whose image did not exist;
      # pressing Update failed and the add-on stayed on the old version.
      # "The image had not finished pushing yet" was the symptom. The cause was
      # that the advertisement preceded the artifact.
      - name: Publish the image before the store can advertise it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ needs.versions.outputs.next-version }}"
          branch="${{ steps.bump.outputs.bump-branch }}"
          # A resumed run whose bump already landed has no branch to build from,
          # but may still have died before the image was pushed. Build from main,
          # which by then carries the same bumped tree. Skipping instead would
          # leave the next step failing with no way to make it pass.
          ref="${branch:-main}"

          before="$(gh run list --workflow release.yml --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run release.yml --ref "${ref}" -f version="${VER}"

          # Find the run this dispatch created, then wait it out. `gh workflow
          # run` does not return an id, so poll for one newer than the last.
          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            candidate="$(gh run list --workflow release.yml --json databaseId --jq '.[0].databaseId // 0')"
            if [ "${candidate}" != "${before}" ]; then run_id="${candidate}"; break; fi
          done
          [ -n "${run_id}" ] || { echo "::error::release.yml did not start for ${ref}"; exit 1; }

          echo "::notice::waiting on release.yml run ${run_id} (building ${VER} from ${ref})"
          gh run watch "${run_id}" --exit-status --interval 20

      # The gate, not a comment: derives the arch set from config.yaml and
      # resolves the manifest ANONYMOUSLY, the way the Supervisor does. An
      # authenticated check would pass while a private package left every
      # instance unable to update.
      - name: Verify the image is published for every declared arch
        run: ./.github/scripts/verify-image-published.sh "${{ needs.versions.outputs.next-version }}"

      - name: Land the bump on main
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          VER="${{ needs.versions.outputs.next-version }}"
          branch="${{ steps.bump.outputs.bump-branch }}"
          if [ -z "${branch}" ]; then
            echo "::notice::config.yaml already at ${VER} on main; nothing to land"
            exit 0
          fi
          gh pr create --base main --head "${branch}" \
            --title "release: bump version to ${VER}" \
            --body "Version bump for v${VER}, opened by the patch-release workflow. The image for ${VER} is already published and verified; merging this is what tells the add-on store the release exists." \
            || echo "::notice::a PR for ${branch} already exists; reusing it"
          # --auto is refused when the PR is already mergeable (nothing left to
          # wait for), so fall back to merging it outright.
          gh pr merge "${branch}" --squash --auto --delete-branch \
            || gh pr merge "${branch}" --squash --delete-branch

          # Wait for the squash to appear on main. Poll the file rather than the
          # PR state: what the next step needs is the bumped content reachable
          # from main, and that is what this asserts.
          for _ in $(seq 1 60); do
            sleep 20
            git fetch --quiet origin main
            if git show "origin/main:hactl_companion/config.yaml" | grep -qx "version: \"${VER}\""; then
              echo "::notice::bump for ${VER} landed on main"
              exit 0
            fi
          done
          echo "::error::bump PR for ${VER} did not land on main within 20 minutes — check its required checks, then re-run this workflow (the bump step is idempotent)"
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HA_STABLE: ${{ needs.versions.outputs.ha-stable }}
        run: |
          # Tag first, annotated, then hang the release off it.
          #
          # `gh release create --target main` mints a LIGHTWEIGHT tag: no
          # tagger, no date, no message. Every companion tag was one, so the
          # repo could not say who cut a release, when, or against which Home
          # Assistant — while hactl's tags carry exactly that. Two halves of
          # one release, one of them with no provenance.
          #
          # Created through the API rather than `git push` on purpose: a ref
          # created with GITHUB_TOKEN does not start another workflow, so this
          # keeps today's build behaviour exactly (the image was already built
          # and verified from the bump branch, before main advertised it).
          tag="${{ needs.versions.outputs.next-tag }}"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          msg="Patch release ${tag} (HA stable at release: ${HA_STABLE:-unknown})"

          tag_sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" --input - --jq .sha <<JSON
          {
            "tag": "${tag}",
            "message": "${msg}",
            "object": "${sha}",
            "type": "commit",
            "tagger": {
              "name": "github-actions[bot]",
              "email": "41898282+github-actions[bot]@users.noreply.github.com"
            }
          }
          JSON
          )
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${tag}" -f "sha=${tag_sha}"
          echo "::notice::annotated tag ${tag} -> ${sha} (${msg})"

          gh release create "${tag}" \
            --title "${tag}" \
            --generate-notes \
            --latest

      # No Docker build is triggered here any more. It ran before the bump
      # reached main and was verified pullable — which is the point of this
      # workflow's ordering. Re-triggering it from the tag would rebuild the
      # same tree under the same tags for no gain, and would restore the
      # impression that the image is something that happens after the release.
      #
      # Note the `release.yml` `push: tags: v*` trigger still fires on the tag
      # created above. That run rebuilds and re-pushes identical tags, which is
      # harmless, and it keeps a tag pushed by hand (outside this workflow)
      # producing an image the way it always has.
