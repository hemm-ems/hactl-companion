name: Monthly Release

on:
  schedule:
    # 10th of each month at 12:17 UTC — a few days after HA's first-Wednesday release.
    # Off the top of the hour: GitHub delays/drops schedules at :00 under load.
    - cron: "17 12 10 * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 2026.6). Leave empty for auto YYYY.M"
        required: false

concurrency:
  group: monthly-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # ---------- Job 0: merge approved dependabot PRs ----------
  merge-deps:
    name: Merge Dependabot PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Merge approved dependabot PRs
        run: |
          prs=$(gh pr list --author "app/dependabot" --state open \
            --json number,mergeable,statusCheckRollup \
            --jq '.[] | select(.mergeable == "MERGEABLE" and ((.statusCheckRollup | length) > 0) and (.statusCheckRollup | all(.state == "SUCCESS"))) | .number')
          if [ -z "$prs" ]; then
            echo "No mergeable dependabot PRs found"
            exit 0
          fi
          for pr in $prs; do
            echo "Merging dependabot PR #${pr}..."
            if gh pr merge "$pr" --squash; then
              echo "✓ PR #${pr} merged"
            else
              echo "⚠ PR #${pr} merge failed (non-blocking)"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull merged changes
        run: git pull --rebase origin main

  # ---------- Job 1: create release ----------
  release:
    name: Create monthly release
    needs: merge-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.PACKAGES_TOKEN }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev

      - name: Compute version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER="$(date -u +'%Y.%-m')"
          fi
          TAG="v${VER}.0"
          echo "ver=${VER}.0" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${VER}" >> "$GITHUB_OUTPUT"

      - name: Check if already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${{ steps.version.outputs.tag }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Bump the version on main FIRST, so the tag cut below points at the bumped
      # commit. Otherwise the image (built from the tag) is built from pre-bump
      # code and self-reports the previous version. Mirrors patch-release.yml.
      - name: Bump version on main
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.ver }}"
          TAG="${{ steps.version.outputs.tag }}"
          # Idempotent: if a previous run already bumped (then failed later), skip
          # so re-running resumes cleanly instead of committing a duplicate bump.
          if grep -qx "version: \"${VER}\"" hactl_companion/config.yaml; then
            echo "::notice::config.yaml already at ${VER}; skipping bump (resuming a partial release)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s/^version = .*/version = \"${VER}\"/" pyproject.toml
          sed -i "s/^version: .*/version: \"${VER}\"/" hactl_companion/config.yaml
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" src/companion/__init__.py
          # Regenerate the OpenAPI spec from the bumped __version__ so info.version and the
          # ENDPOINT_META-derived body stay in one source of truth (no drift vs `make spec`).
          uv run python -c "from companion.openapi import write_spec; write_spec()"
          # Generate notes via the API (no release exists yet — created below).
          NOTES=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" -f target_commitish=main --jq '.body' | sed '/^---$/,$d')
          {
            printf "## %s\n\n%s\n\n" "${VER}" "${NOTES}"
            cat hactl_companion/CHANGELOG.md
          } > /tmp/changelog_new.md
          mv /tmp/changelog_new.md hactl_companion/CHANGELOG.md
          git add pyproject.toml openapi/companion-v1.yaml hactl_companion/config.yaml src/companion/__init__.py hactl_companion/CHANGELOG.md
          git commit -m "release: bump version to ${VER}"
          git push origin HEAD:main

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --target main now resolves to the bump commit pushed above, so the
          # tag (and the image built from it) carry the correct version.
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.version.outputs.title }}" \
            --generate-notes \
            --target main \
            --latest

      - name: Trigger release workflow (Docker build & push)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Wait briefly for the tag to propagate
          sleep 5
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ steps.version.outputs.tag }}"
