name: Monthly Release

on:
  schedule:
    # 10th of each month at 12:17 UTC — a few days after HA's first-Wednesday release.
    # Off the top of the hour: GitHub delays/drops schedules at :00 under load.
    - cron: "17 12 10 * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 2026.6). Leave empty for auto YYYY.M"
        required: false

concurrency:
  group: monthly-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # ---------- Job 0: merge approved dependabot PRs ----------
  merge-deps:
    name: Merge Dependabot PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Merge approved dependabot PRs
        run: |
          prs=$(gh pr list --author "app/dependabot" --state open \
            --json number,mergeable,statusCheckRollup \
            --jq '.[] | select(.mergeable == "MERGEABLE" and ((.statusCheckRollup | length) > 0) and (.statusCheckRollup | all(.state == "SUCCESS"))) | .number')
          if [ -z "$prs" ]; then
            echo "No mergeable dependabot PRs found"
            exit 0
          fi
          for pr in $prs; do
            echo "Merging dependabot PR #${pr}..."
            if gh pr merge "$pr" --squash; then
              echo "✓ PR #${pr} merged"
            else
              echo "⚠ PR #${pr} merge failed (non-blocking)"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull merged changes
        run: git pull --rebase origin main

  # ---------- Job 1: create release ----------
  release:
    name: Create monthly release
    needs: merge-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PACKAGES_TOKEN }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev

      - name: Compute version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER="$(date -u +'%Y.%-m')"
          fi
          TAG="v${VER}.0"
          echo "ver=${VER}.0" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${VER}" >> "$GITHUB_OUTPUT"

      - name: Check if already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${{ steps.version.outputs.tag }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Same four ordered facts as patch-release.yml, and for the same reason:
      #
      #   1. the bump exists on a BRANCH        (nothing reads it yet)
      #   2. the image for that version is PUBLISHED and verified
      #   3. the bump lands on MAIN             (the add-on store now sees it)
      #   4. the tag and GitHub Release are cut from main
      #
      # Home Assistant's add-on store reads `version` from
      # hactl_companion/config.yaml on the default branch, so landing the bump IS
      # the advertisement. This workflow used to do it first and trigger the
      # Docker build last, which offered every instance an update whose image did
      # not exist yet.
      #
      # It also used to `git push origin HEAD:main`, which branch protection has
      # refused since 2026-07-28 (enforce_admins, three required checks). That
      # made this workflow unable to release at all; the PR flow below is the one
      # patch-release.yml already proved.
      - name: Prepare the version bump on a branch
        id: bump
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.ver }}"
          TAG="${{ steps.version.outputs.tag }}"
          # Idempotent: if a previous run already bumped (then failed later), skip
          # so re-running resumes cleanly instead of committing a duplicate bump.
          if grep -qx "version: \"${VER}\"" hactl_companion/config.yaml; then
            echo "::notice::config.yaml already at ${VER}; skipping bump (resuming a partial release)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s/^version = .*/version = \"${VER}\"/" pyproject.toml
          sed -i "s/^version: .*/version: \"${VER}\"/" hactl_companion/config.yaml
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" src/companion/__init__.py
          # Regenerate the OpenAPI spec from the bumped __version__ so info.version and the
          # ENDPOINT_META-derived body stay in one source of truth (no drift vs `make spec`).
          uv run python -c "from companion.openapi import write_spec; write_spec()"
          # Generate notes via the API (no release exists yet — created below).
          NOTES=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" -f target_commitish=main --jq '.body' | sed '/^---$/,$d')
          {
            printf "## %s\n\n%s\n\n" "${VER}" "${NOTES}"
            cat hactl_companion/CHANGELOG.md
          } > /tmp/changelog_new.md
          mv /tmp/changelog_new.md hactl_companion/CHANGELOG.md
          git add pyproject.toml openapi/companion-v1.yaml hactl_companion/config.yaml src/companion/__init__.py hactl_companion/CHANGELOG.md
          git commit -m "release: bump version to ${VER}"
          branch="release/bump-${VER}"
          git push --force origin "HEAD:refs/heads/${branch}"
          echo "bump-branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Publish the image before the store can advertise it
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.ver }}"
          branch="${{ steps.bump.outputs.bump-branch }}"
          # A resumed run whose bump already landed has no branch; main carries
          # the same bumped tree by then.
          ref="${branch:-main}"

          before="$(gh run list --workflow release.yml --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run release.yml --ref "${ref}" -f version="${VER}"

          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            candidate="$(gh run list --workflow release.yml --json databaseId --jq '.[0].databaseId // 0')"
            if [ "${candidate}" != "${before}" ]; then run_id="${candidate}"; break; fi
          done
          [ -n "${run_id}" ] || { echo "::error::release.yml did not start for ${ref}"; exit 1; }

          echo "::notice::waiting on release.yml run ${run_id} (building ${VER} from ${ref})"
          gh run watch "${run_id}" --exit-status --interval 20

      - name: Verify the image is published for every declared arch
        if: steps.check.outputs.exists == 'false'
        run: ./.github/scripts/verify-image-published.sh "${{ steps.version.outputs.ver }}"

      - name: Land the bump on main
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.ver }}"
          branch="${{ steps.bump.outputs.bump-branch }}"
          if [ -z "${branch}" ]; then
            echo "::notice::config.yaml already at ${VER} on main; nothing to land"
            exit 0
          fi
          gh pr create --base main --head "${branch}" \
            --title "release: bump version to ${VER}" \
            --body "Version bump for v${VER}, opened by the monthly-release workflow. The image for ${VER} is already published and verified; merging this is what tells the add-on store the release exists." \
            || echo "::notice::a PR for ${branch} already exists; reusing it"
          gh pr merge "${branch}" --squash --auto --delete-branch \
            || gh pr merge "${branch}" --squash --delete-branch

          for _ in $(seq 1 60); do
            sleep 20
            git fetch --quiet origin main
            if git show "origin/main:hactl_companion/config.yaml" | grep -qx "version: \"${VER}\""; then
              echo "::notice::bump for ${VER} landed on main"
              exit 0
            fi
          done
          echo "::error::bump PR for ${VER} did not land on main within 20 minutes — check its required checks, then re-run this workflow (the bump step is idempotent)"
          exit 1

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --target main now resolves to the bump commit pushed above, so the
          # tag (and the image built from it) carry the correct version.
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.version.outputs.title }}" \
            --generate-notes \
            --target main \
            --latest

      # No Docker build is triggered here any more — it ran before the bump
      # reached main and was verified pullable, which is the point of the
      # ordering above. `release.yml` still fires on the tag push, rebuilding
      # identical tags harmlessly and keeping a hand-pushed tag working.
