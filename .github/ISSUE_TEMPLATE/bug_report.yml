name: Bug report
description: Something in the companion add-on is broken. Human-written only.
labels: ["bug", "needs-repro"]
body:
  - type: markdown
    attributes:
      value: |
        **Read this first.**

        We live in an AI world: **if your AI can find a bug, it can fix it.** If you (or your
        agent) found a real problem, please open a **pull request** with the fix instead.

        - 🤖 **AI-generated issues are rejected** and closed as invalid.
        - ✍️ **Human-written issues are always welcome** — write it in your own words.
        - The fields below ask for exact versions, what you did, and the logs.
          That is what lets the maintainer's LLM reproduce and fix it. No repro, no fix.
  - type: input
    id: version
    attributes:
      label: Add-on version
      description: Settings → Add-ons → hactl companion.
      placeholder: "2026.6.6"
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - HA OS
        - Supervised
        - Container
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: Exact steps / the hactl command or request that triggered it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: What actually happened (add-on logs)
      description: Paste the add-on log output. Redact tokens / URLs if needed.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: attestation
    attributes:
      label: Attestation
      options:
        - label: I wrote this issue myself. It was not generated by an AI.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
